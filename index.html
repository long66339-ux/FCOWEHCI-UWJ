<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for crisp icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3e7e9 0%, #e3eeff 99%, #e3eeff 100%);
        }
        
        /* Custom scrollbar for the task list */
        .task-container::-webkit-scrollbar {
            width: 6px;
        }
        .task-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .task-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .task-item-enter {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Custom Checkbox */
        .custom-checkbox input:checked + div {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
        .custom-checkbox input:checked + div svg {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[80vh] max-h-[600px]">
        
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-white shadow-md relative z-10">
            <h1 class="text-2xl font-bold tracking-tight mb-1">My Tasks</h1>
            <p class="text-indigo-200 text-sm" id="task-counter">Loading tasks...</p>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-50 border-b border-gray-100">
            <form id="todo-form" class="relative flex items-center">
                <input 
                    type="text" 
                    id="todo-input" 
                    placeholder="What needs to be done?" 
                    class="w-full pl-4 pr-14 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm placeholder-gray-400 text-gray-700"
                    autocomplete="off"
                    required
                >
                <button 
                    type="submit" 
                    class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-indigo-600 hover:bg-indigo-700 text-white w-9 h-9 rounded-lg flex items-center justify-center transition-colors shadow-sm"
                    aria-label="Add task"
                >
                    <i class="fas fa-plus"></i>
                </button>
            </form>
        </div>

        <!-- Task List Container -->
        <div class="flex-1 overflow-y-auto task-container bg-white relative">
            <ul id="todo-list" class="divide-y divide-gray-100 flex flex-col">
                <!-- Tasks will be dynamically inserted here via JS -->
            </ul>

            <!-- Empty State (Hidden by default) -->
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center hidden pointer-events-none">
                <div class="w-24 h-24 bg-indigo-50 rounded-full flex items-center justify-center mb-4 text-indigo-300">
                    <i class="fas fa-clipboard-check text-4xl"></i>
                </div>
                <h3 class="text-gray-900 font-semibold mb-1">All caught up!</h3>
                <p class="text-gray-500 text-sm">Add a task above to get started.</p>
            </div>
        </div>
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const form = document.getElementById('todo-form');
            const input = document.getElementById('todo-input');
            const todoList = document.getElementById('todo-list');
            const emptyState = document.getElementById('empty-state');
            const taskCounter = document.getElementById('task-counter');

            // State: Load from localStorage or initialize empty array
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

            // Save tasks to localStorage
            const saveTasks = () => {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            };

            // Update Header Counter
            const updateCounter = () => {
                const total = tasks.length;
                const completed = tasks.filter(t => t.completed).length;
                if (total === 0) {
                    taskCounter.textContent = "No tasks yet";
                } else if (completed === total) {
                    taskCounter.textContent = "All tasks completed! 🎉";
                } else {
                    taskCounter.textContent = `${completed} of ${total} tasks completed`;
                }
            };

            // Render tasks to the DOM
            const renderTasks = () => {
                // Clear current list
                todoList.innerHTML = '';

                // Handle Empty State Visibility
                if (tasks.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                }

                // Create DOM elements for each task
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `group flex items-center justify-between p-4 hover:bg-gray-50 transition-colors duration-200 ${task.completed ? 'opacity-75' : ''}`;
                    li.dataset.id = task.id;

                    // HTML structure for a single task item
                    li.innerHTML = `
                        <label class="custom-checkbox flex items-center cursor-pointer flex-1 min-w-0">
                            <input type="checkbox" class="sr-only" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                            <div class="w-6 h-6 rounded border-2 border-gray-300 mr-4 flex-shrink-0 flex items-center justify-center transition-colors bg-white hover:border-indigo-400">
                                <svg class="w-4 h-4 text-white hidden pointer-events-none" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                                </svg>
                            </div>
                            <span class="text-gray-800 break-words flex-1 transition-all duration-300 ${task.completed ? 'line-through text-gray-400' : ''}">
                                ${escapeHTML(task.text)}
                            </span>
                        </label>
                        <button onclick="deleteTask(${task.id})" class="ml-4 w-8 h-8 flex items-center justify-center text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all opacity-0 group-hover:opacity-100 focus:opacity-100" aria-label="Delete task">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    `;
                    todoList.appendChild(li);
                });

                updateCounter();
            };

            // Security: Escape HTML to prevent XSS
            const escapeHTML = (str) => {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            };

            // Add new task
            const addTask = (e) => {
                e.preventDefault();
                const text = input.value.trim();
                
                if (text) {
                    const newTask = {
                        id: Date.now(), // Unique ID based on timestamp
                        text: text,
                        completed: false
                    };
                    
                    // Add to beginning of array
                    tasks.unshift(newTask);
                    saveTasks();
                    
                    // Clear input and focus
                    input.value = '';
                    input.focus();
                    
                    renderTasks();
                    
                    // Add animation to the newly added item
                    const firstItem = todoList.firstElementChild;
                    if(firstItem) firstItem.classList.add('task-item-enter');
                }
            };

            // Toggle task completion status
            window.toggleTask = (id) => {
                tasks = tasks.map(task => {
                    if (task.id === id) {
                        return { ...task, completed: !task.completed };
                    }
                    return task;
                });
                saveTasks();
                renderTasks();
            };

            // Delete a task
            window.deleteTask = (id) => {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderTasks();
            };

            // Event Listeners
            form.addEventListener('submit', addTask);

            // Initial Render
            renderTasks();
        });
    </script>
</body>
</html>
